[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-evals"
version = "0.4.0"
description = "A small, reproducible evaluation CLI for verifiable tasks"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
http = ["aiohttp>=3.11,<4"]

[project.scripts]
forge = "forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
